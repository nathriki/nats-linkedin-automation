# Local NATS server config for nats-linkedin-automation.
# Run: nats-server -c nats/nats-server.conf

port: 4222

# HTTP monitoring endpoint (http://localhost:8222) -- useful for checking
# connections/streams while developing. Not exposed beyond localhost.
http_port: 8222

jetstream {
  store_dir: "./nats/data/jetstream"
  max_mem_store: 256MB
  max_file_store: 1GB
}
